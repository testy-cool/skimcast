[project]
name = "skimcast"
version = "0.1.0"
description = "Turn a screen recording into the few timestamped screenshots an AI agent needs to read it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.scripts]
skimcast = "skimcast:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skimcast.py"]
